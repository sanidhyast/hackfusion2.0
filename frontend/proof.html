<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incident evidence | SafeSight AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=18.0">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body.proof-page {
            display: block;
            background: var(--concrete);
        }

        .proof-topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 10px 32px;
            background: var(--panel);
            border-bottom: 1px solid var(--rule);
        }

        .proof-action-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .proof-action-row a { text-decoration: none; }

        .proof-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px 32px 48px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .proof-title-row { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
        .proof-title-row .status-badge-chip { font-size: 14px; padding: 2px 10px; }

        .proof-facts {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 24px;
            margin-top: 6px;
            color: var(--ink-2);
        }

        .proof-facts dt { display: inline; color: var(--ink-3); }
        .proof-facts dt::after { content: " "; }
        .proof-facts dd { display: inline; color: var(--graphite); font-weight: 500; }

        .proof-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 16px 20px;
            align-items: start;
        }

        .proof-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

        .proof-image-stage {
            min-height: 360px;
            display: grid;
            place-items: center;
            background: var(--monitor);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .proof-image-stage img {
            display: block;
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
            outline: 1px solid oklch(0 0 0 / 0.1);
            outline-offset: -1px;
        }

        .proof-empty-msg {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 24px;
            color: #b5bcc0;
            text-align: center;
        }

        .proof-empty-msg svg.lucide { width: 28px; height: 28px; stroke-width: 1.5; }

        .multicam-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding-top: 8px;
        }

        .multicam-thumb {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 4px;
            background: var(--panel);
            border: 1px solid var(--rule);
            border-radius: var(--radius-md);
            font-size: 13px;
            color: var(--ink-2);
            text-align: center;
        }

        .multicam-thumb img {
            width: 128px;
            height: 72px;
            object-fit: cover;
            border-radius: 2px;
            outline: 1px solid oklch(0 0 0 / 0.1);
            outline-offset: -1px;
        }

        /* Worker findings */
        .worker-findings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 8px;
        }

        .worker-finding-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 12px 14px;
            background: #fff;
            border: 1px solid var(--rule);
            border-left: 4px solid var(--safe-green);
            border-radius: var(--radius-sm);
        }

        .worker-finding-card.is-violation { border-left-color: var(--signal-red); }

        .worker-card-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .worker-name { font-weight: 600; }
        .worker-name { display: block; }
        .worker-conf { display: block; font-size: 13px; color: var(--ink-3); }

        .worker-finding-row { display: flex; flex-direction: column; gap: 4px; }
        .finding-sublabel { font-size: 13px; color: var(--ink-2); }
        .chips-list { display: flex; flex-wrap: wrap; gap: 4px; }
        .chips-none { font-size: 13px; color: var(--ink-3); }

        /* PPE rules checked */
        .rules-list { display: flex; flex-direction: column; }

        .rule-row {
            display: grid;
            grid-template-columns: 32px 1fr auto;
            align-items: center;
            gap: 10px;
            padding: 8px 8px 8px 6px;
            border-top: 1px solid var(--rule-soft);
            font-size: 14px;
        }

        .rule-row:first-child { border-top: none; }

        .rule-roundel {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--surface-raised);
            color: var(--ink-3);
        }

        .rule-row.active .rule-roundel { background: var(--mandatory-blue); color: #fff; }
        .rule-row .rule-state { font-size: 13px; color: var(--ink-3); }
        .rule-row.active .rule-state { color: var(--mandatory-blue); font-weight: 500; }
        .rule-row:not(.active) .rule-name { color: var(--ink-2); }

        .proof-aside { position: sticky; top: 76px; }

        @media (max-width: 1000px) {
            .proof-layout { grid-template-columns: minmax(0, 1fr); }
            .proof-aside { position: static; }
        }

        @media (max-width: 640px) {
            .proof-topbar { padding: 10px 16px; flex-wrap: wrap; }
            .proof-container { padding: 16px 16px 40px; }
            .proof-action-row { width: 100%; }
            .proof-action-row > * { flex: 1; }
        }

        @media print {
            .proof-topbar { display: none !important; }
            body.proof-page { background: #fff; }
            .proof-container { padding: 0; }
            .proof-layout { grid-template-columns: minmax(0, 1fr); }
            .surface, .site-status { box-shadow: none; border: 1px solid #ccc; }
            .proof-image-stage { background: #fff; }
        }
    </style>
</head>
<body class="proof-page">

    <header class="proof-topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true"><i data-lucide="hard-hat"></i></span>
            <span class="brand-name">SafeSight AI</span>
        </div>
        <div class="proof-action-row">
            <a href="/" class="btn-ghost btn-sm"><i data-lucide="arrow-left"></i> Back to dashboard</a>
            <button class="btn-outlined btn-sm" id="btn-download-img" onclick="downloadProofImage()"><i data-lucide="download"></i> Download photo</button>
            <button class="btn-primary btn-sm" onclick="window.print()"><i data-lucide="printer"></i> Print or save PDF</button>
        </div>
    </header>

    <main class="proof-container">

        <header>
            <div class="proof-title-row">
                <h1 class="page-title" id="proof-id">Loading incident</h1>
                <span id="proof-status-badge" class="status-badge-chip hidden"></span>
            </div>
            <dl class="proof-facts">
                <div><dt>Camera</dt><dd id="meta-location">…</dd></div>
                <div><dt>Logged</dt><dd id="proof-timestamp">…</dd></div>
            </dl>
            <p class="page-sub" id="proof-verdict" style="margin-top:8px;">Loading the incident record.</p>
        </header>

        <section class="kpi-row site-status" aria-label="Incident summary">
            <span class="status-sign" aria-hidden="true"><span class="sign-ok">✓</span><span class="sign-bad">!</span></span>
            <div class="kpi-card">
                <span class="kpi-numeral" id="meta-total">0</span>
                <span class="kpi-label">workers in photo</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-numeral" id="meta-compliant">0</span>
                <span class="kpi-label">wearing required PPE</span>
            </div>
            <div class="kpi-card" id="meta-violations-card">
                <span class="kpi-numeral" id="meta-violations">0</span>
                <span class="kpi-label">missing PPE</span>
            </div>
            <div class="kpi-card">
                <span class="kpi-numeral" id="meta-rate">100%</span>
                <span class="kpi-label">compliance</span>
            </div>
        </section>

        <div class="proof-layout">
            <div class="proof-main">
                <section class="surface card" aria-labelledby="evidence-title">
                    <div class="card-head">
                        <h2 class="section-label" id="evidence-title">Evidence photo</h2>
                        <span class="card-hint">Boxes show each detected worker</span>
                    </div>
                    <div class="proof-image-stage">
                        <div id="proof-empty-box" class="proof-empty-msg hidden">
                            <i data-lucide="image-off"></i>
                            <span>No photo was saved with this incident.</span>
                        </div>
                        <img id="proof-main-image" src="" alt="Evidence photo for this incident" class="hidden">
                    </div>
                </section>

                <section class="surface card" aria-labelledby="workers-title">
                    <div class="card-head">
                        <h2 class="section-label" id="workers-title">Workers</h2>
                    </div>
                    <div class="worker-findings-grid" id="workers-container"></div>
                </section>
            </div>

            <aside class="proof-aside">
                <section class="surface card" aria-labelledby="rules-title">
                    <div class="card-head">
                        <h2 class="section-label" id="rules-title">PPE checked</h2>
                    </div>
                    <div class="rules-list" id="rules-container"></div>
                </section>
            </aside>
        </div>

    </main>

    <script>
        let currentSnapshotUrl = null;
        let currentIncidentId = null;

        const RULE_DEFINITIONS = [
            { key: "helmet", label: "Hard hat", icon: "hard-hat" },
            { key: "vest", label: "Hi-vis vest", icon: "shirt" },
            { key: "helmet_arm", label: "Hard hat carried, not worn", icon: "user-x" },
            { key: "gloves", label: "Gloves", icon: "hand" },
            { key: "boots", label: "Safety boots", icon: "footprints" },
            { key: "goggles", label: "Eye protection", icon: "glasses" },
            { key: "loose", label: "Loose or other PPE", icon: "alert-triangle" }
        ];

        document.addEventListener("DOMContentLoaded", async () => {
            const params = new URLSearchParams(window.location.search);
            let incidentId = params.get("id");

            let incident = null;

            // 1. Try loading from localStorage first
            try {
                const stored = localStorage.getItem("ppe_audit_logs");
                if (stored) {
                    const auditLogs = JSON.parse(stored);
                    if (incidentId) {
                        incident = auditLogs.find(l => l.id === incidentId);
                    } else if (auditLogs.length > 0) {
                        incident = auditLogs[0];
                    }
                }
            } catch (e) {
                console.warn("Could not read from localStorage:", e);
            }

            // 2. Fallback to Backend API if not found in localStorage
            if (!incident) {
                try {
                    const endpoint = incidentId ? `/api/audit/incident/${incidentId}` : `/api/audit/latest`;
                    const res = await fetch(endpoint);
                    const data = await res.json();
                    if (data && data.success && data.incident) {
                        incident = data.incident;
                    }
                } catch (apiErr) {
                    console.warn("Could not fetch incident from backend:", apiErr);
                }
            }

            // 3. Fallback to direct snapshot URL if still not found
            if (!incident && incidentId) {
                incident = {
                    id: incidentId,
                    timestamp: new Date().toLocaleString(),
                    camera: "CCTV Stream",
                    totalWorkers: 1,
                    compliant: 0,
                    violations: 1,
                    verdict: "Live Safety Breach Flagged",
                    snapshotImage: `/media/snapshots/${incidentId}.jpg`
                };
            }

            if (!incident) {
                document.getElementById("proof-id").innerText = "Incident not found";
                document.getElementById("proof-verdict").innerText = "There is no record for this incident. Log one from the camera, photo, or video screens first.";
                document.getElementById("proof-empty-box").classList.remove("hidden");
                if (window.lucide) window.lucide.createIcons();
                return;
            }

            currentIncidentId = incident.id;

            // Populate header
            document.getElementById("proof-id").innerText = incident.id;
            document.title = `${incident.id} | SafeSight AI`;

            const isViol = incident.violations > 0;
            const badge = document.getElementById("proof-status-badge");
            badge.className = `status-badge-chip ${isViol ? "violation" : "compliant"}`;
            badge.innerText = isViol ? "Missing PPE" : "Wearing PPE";
            document.getElementById("meta-violations-card").classList.toggle("has-violations", isViol);

            document.getElementById("proof-verdict").innerText = incident.verdict || "Everyone was wearing the required PPE.";
            document.getElementById("proof-timestamp").innerText = incident.timestamp || new Date().toLocaleString();

            // Populate KPIs
            document.getElementById("meta-location").innerText = incident.camera || "Inspection";
            document.getElementById("meta-total").innerText = incident.totalWorkers || 0;
            document.getElementById("meta-compliant").innerText = incident.compliant || 0;
            document.getElementById("meta-violations").innerText = incident.violations || 0;

            const total = incident.totalWorkers || 0;
            const comp = incident.compliant || 0;
            const rate = total > 0 ? Math.round((comp / total) * 100) : 100;
            document.getElementById("meta-rate").innerText = `${rate}%`;

            // Populate Enforced Rules
            renderEnforcedRules(incident);

            // Populate Worker Breakdown Findings
            renderWorkerFindings(incident);

            // Populate Snapshot Image
            const imgEl = document.getElementById("proof-main-image");
            const emptyEl = document.getElementById("proof-empty-box");
            const candidateUrl = incident.snapshotImage || `/media/snapshots/${incident.id}.jpg`;

            currentSnapshotUrl = candidateUrl;
            imgEl.src = candidateUrl;
            imgEl.onload = () => {
                imgEl.classList.remove("hidden");
                emptyEl.classList.add("hidden");
            };
            imgEl.onerror = () => {
                if (imgEl.src !== window.location.origin + `/media/snapshots/${incident.id}.jpg`) {
                    imgEl.src = `/media/snapshots/${incident.id}.jpg`;
                } else {
                    imgEl.classList.add("hidden");
                    emptyEl.classList.remove("hidden");
                    const dlBtn = document.getElementById("btn-download-img");
                    if (dlBtn) dlBtn.style.display = "none";
                }
            };

            // Render multi-camera angle thumbnails if available
            renderMultiCamAngleThumbnails(incident);

            if (window.lucide) window.lucide.createIcons();
        });

        function renderMultiCamAngleThumbnails(incident) {
            const views = incident.multi_cam_views || incident.multiCamViews;
            if (!views || Object.keys(views).length <= 1) return;

            const stage = document.querySelector(".proof-image-stage");
            if (!stage) return;

            let strip = document.getElementById("multicam-thumb-strip");
            if (!strip) {
                strip = document.createElement("div");
                strip.id = "multicam-thumb-strip";
                strip.className = "multicam-strip";
                stage.parentNode.appendChild(strip);
            }

            strip.innerHTML = Object.entries(views).map(([camKey, cData]) => {
                const imgUrl = cData.url || cData.image;
                return `
                    <button type="button" class="multicam-thumb" onclick="switchProofView('${imgUrl}')">
                        <img src="${imgUrl}" alt="${cData.label || camKey}">
                        <span>${cData.label || camKey}</span>
                    </button>
                `;
            }).join("");
        }

        function switchProofView(url) {
            const imgEl = document.getElementById("proof-main-image");
            if (imgEl && url) {
                imgEl.src = url;
                currentSnapshotUrl = url;
            }
        }

        function renderEnforcedRules(incident) {
            const container = document.getElementById("rules-container");
            if (!container) return;

            // If incident.activeRules was recorded, use it; otherwise deduce from verdict or defaults
            let activeRules = incident.activeRules;
            if (!activeRules) {
                activeRules = {
                    helmet: true,
                    vest: true,
                    helmet_arm: (incident.verdict || "").includes("Arm"),
                    gloves: (incident.verdict || "").includes("glove"),
                    boots: (incident.verdict || "").includes("boot"),
                    goggles: (incident.verdict || "").includes("eye") || (incident.verdict || "").includes("goggle"),
                    loose: false
                };
            }

            container.innerHTML = RULE_DEFINITIONS.map(rule => {
                const isEnforced = !!activeRules[rule.key];
                return `
                    <div class="rule-row ${isEnforced ? "active" : ""}">
                        <span class="rule-roundel"><i data-lucide="${rule.icon}"></i></span>
                        <span class="rule-name">${rule.label}</span>
                        <span class="rule-state">${isEnforced ? "Required" : "Not checked"}</span>
                    </div>
                `;
            }).join("");
        }

        function renderWorkerFindings(incident) {
            const container = document.getElementById("workers-container");
            if (!container) return;

            let workers = incident.workers;

            // Fallback for older audit logs that only stored the verdict text
            if (!workers || workers.length === 0) {
                workers = parseWorkersFromVerdict(incident);
            }

            if (!workers || workers.length === 0) {
                container.innerHTML = `<div class="list-empty" style="grid-column:1/-1;">No per-worker details were saved with this incident.</div>`;
                return;
            }

            container.innerHTML = workers.map((w, idx) => {
                const isViolation = !w.is_compliant;
                const cardClass = isViolation ? "worker-finding-card is-violation" : "worker-finding-card";
                const statusBadge = isViolation
                    ? `<span class="status-badge-chip violation">Missing PPE</span>`
                    : `<span class="status-badge-chip compliant">Wearing PPE</span>`;

                const conf = w.confidence ? `${Math.round(w.confidence * 100)}%` : null;

                // Missing breaches
                let breachesHtml = "";
                if (isViolation && w.missing_chips && w.missing_chips.length > 0) {
                    breachesHtml = w.missing_chips.map(chip => `<span class="violation-pill-chip">${chip}</span>`).join("");
                } else if (!isViolation) {
                    breachesHtml = `<span class="chips-none">Nothing missing</span>`;
                } else {
                    breachesHtml = `<span class="violation-pill-chip">Missing PPE</span>`;
                }

                // Verified compliant gear
                let gearHtml = "";
                const detected = w.detected_ppe || {};
                const gearList = [];
                if (detected.helmet) gearList.push("Hard hat");
                if (detected.vest) gearList.push("Hi-vis vest");
                if (detected.gloves) gearList.push("Gloves");
                if (detected.boots) gearList.push("Safety boots");
                if (detected.goggles) gearList.push("Eye protection");

                if (gearList.length > 0) {
                    gearHtml = gearList.map(g => `<span class="compliant-pill-chip">${g}</span>`).join("");
                } else {
                    gearHtml = `<span class="chips-none">No PPE detected</span>`;
                }

                const name = w.worker_id.toString().startsWith("Worker") ? w.worker_id : `Worker ${w.worker_id}`;

                return `
                    <div class="${cardClass}">
                        <div class="worker-card-header">
                            <span><span class="worker-name">${name}</span>${conf ? `<span class="worker-conf">${conf} confidence</span>` : ""}</span>
                            ${statusBadge}
                        </div>
                        <div class="worker-finding-row">
                            <span class="finding-sublabel">Missing</span>
                            <div class="chips-list">${breachesHtml}</div>
                        </div>
                        <div class="worker-finding-row">
                            <span class="finding-sublabel">Wearing</span>
                            <div class="chips-list">${gearHtml}</div>
                        </div>
                    </div>
                `;
            }).join("");
        }

        function parseWorkersFromVerdict(incident) {
            const text = incident.verdict || "";
            if (!text || text.includes("Compliance Verified")) {
                const total = incident.totalWorkers || 1;
                const workers = [];
                for (let i = 1; i <= total; i++) {
                    workers.push({
                        worker_id: i,
                        confidence: 0.85,
                        is_compliant: true,
                        missing_chips: [],
                        detected_ppe: { helmet: true, vest: true }
                    });
                }
                return workers;
            }

            // Split by " | "
            const parts = text.split(" | ");
            const workers = [];
            const visited = new Set();

            parts.forEach((p, idx) => {
                const m = p.match(/Worker\s*#?(\d+):\s*(.*)/i);
                if (m) {
                    const wid = parseInt(m[1], 10);
                    visited.add(wid);
                    const missing = m[2].split(",").map(s => s.trim()).filter(Boolean);
                    workers.push({
                        worker_id: wid,
                        confidence: 0.70,
                        is_compliant: false,
                        missing_chips: missing,
                        detected_ppe: {
                            helmet: !missing.some(x => x.toLowerCase().includes("helmet")),
                            vest: !missing.some(x => x.toLowerCase().includes("vest"))
                        }
                    });
                }
            });

            // If there are compliant workers not mentioned in verdict
            const total = incident.totalWorkers || workers.length;
            for (let i = 1; i <= total; i++) {
                if (!visited.has(i)) {
                    workers.push({
                        worker_id: i,
                        confidence: 0.75,
                        is_compliant: true,
                        missing_chips: [],
                        detected_ppe: { helmet: true, vest: true }
                    });
                }
            }

            return workers.sort((a, b) => (a.worker_id > b.worker_id ? 1 : -1));
        }

        function downloadProofImage() {
            if (!currentSnapshotUrl) return;
            const a = document.createElement("a");
            a.href = currentSnapshotUrl;
            a.download = `incident_proof_${currentIncidentId || Date.now()}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
